name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Lint source code
        run: pnpm lint

      - name: Check source code
        run: pnpm check

      - name: Test packages (unit)
        run: pnpm test

      - name: Test dotnet
        run: dotnet test --solution Phoria.sln --configuration Release

  test-browser:
    name: Browser & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-mode component tests
        run: pnpm test:browser

      - name: Build e2e app
        run: pnpm --filter framework-multiple build

      - name: Install Aspire CLI
        run: |
          curl -fsSL https://aspire.dev/install.sh | bash -s -- --version "13.4.6" --skip-path
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: Start preview and run smoke test
        run: |
          pnpm --filter framework-multiple preview &
          PREVIEW_PID=$!
          for i in $(seq 1 60); do
            curl -skf https://localhost:5247 > /dev/null 2>&1 && break
            sleep 1
          done
          NODE_TLS_REJECT_UNAUTHORIZED=0 pnpm --filter framework-multiple test:smoke
          kill $PREVIEW_PID
