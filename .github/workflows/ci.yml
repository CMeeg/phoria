name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Check examples reference published versions
        run: pnpm examples:check

      - name: Build packages
        run: pnpm build

      - name: Lint source code
        run: pnpm lint

      - name: Check source code
        run: pnpm check

      - name: Test packages (unit)
        run: pnpm test

      - name: Test dotnet
        run: dotnet test --solution Phoria.sln --configuration Release

      - name: Test packages (coverage)
        run: pnpm test:coverage

      - name: Test dotnet (coverage)
        run: dotnet test --solution Phoria.sln --configuration Release --coverlet --coverlet-output-format cobertura --coverlet-file-prefix ""

      - name: Prepare coverage reports for Codecov
        run: node scripts/coverage.js

      - name: Upload coverage to Codecov (JS)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/phoria-islands/coverage/lcov.info,packages/phoria-react/coverage/lcov.info,packages/phoria-svelte/coverage/lcov.info,packages/phoria-vue/coverage/lcov.info,packages/phoria-opentelemetry/coverage/lcov.info,packages/vite-plugin-dotnet-dev-certs/coverage/lcov.info
          flags: js
          fail_ci_if_error: true

      - name: Upload coverage to Codecov (.NET)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: TestResults/net8.0.cobertura.xml,TestResults/net10.0.cobertura.xml
          flags: dotnet
          fail_ci_if_error: true

      - name: Upload bundle analysis to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          for pkg in phoria-islands phoria-react phoria-svelte phoria-vue phoria-opentelemetry vite-plugin-dotnet-dev-certs; do
            [ -d "packages/$pkg/dist" ] || continue
            pnpm exec bundle-analyzer "packages/$pkg/dist" \
              --bundle-name="$pkg" \
              --upload-token="$CODECOV_TOKEN" \
              --ignore-patterns '*.d.ts' '*.map'
          done

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-reports
          path: |
            **/coverage/**
            **/TestResults/*cobertura*.xml

  test-browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-mode component tests
        run: pnpm test:browser
