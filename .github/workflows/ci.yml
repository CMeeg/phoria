name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Automatically cancel older in-progress jobs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm lerna run build

      - name: Lint source code
        run: pnpm lerna run lint

      - name: Check source code
        run: pnpm lerna run check

      - name: Test packages (unit)
        run: pnpm lerna run test

      - name: Test dotnet
        run: dotnet test Phoria.sln --configuration Release

  test-browser:
    name: Browser & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: "./global.json"

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm lerna run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser-mode component tests
        run: pnpm lerna run test:browser

      - name: Build e2e app
        run: pnpm --filter framework-multiple build

      - name: Start preview and run smoke test
        run: |
          pnpm --filter framework-multiple preview &
          PREVIEW_PID=$!
          for i in $(seq 1 60); do
            curl -sf http://localhost:5247 > /dev/null 2>&1 && break
            sleep 1
          done
          pnpm --filter framework-multiple test:smoke
          kill $PREVIEW_PID
