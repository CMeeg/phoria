packages:
  - "e2e/framework-multiple"
  - "e2e/with-workspace/*"
  - "packages/*"

# Required for `pnpm deploy` (used by the e2e Dockerfiles) to produce a self-contained,
# non-symlinked node_modules once the deploy dir is copied to an isolated Docker stage.
injectWorkspacePackages: true

allowBuilds:
  '@biomejs/biome': true
  '@parcel/watcher': true
  esbuild: true

catalog:
  "@meeg/vite-plugin-inspect-config": ~0.3.0
  "@rollup/pluginutils": ^5.4.0
  "@sveltejs/vite-plugin-svelte": ^7.2.0
  "@types/node": ^24.13.3
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.4
  "@vitejs/plugin-vue": ^6.0.8
  "@vitest/browser-playwright": ^4.1.10
  cross-env: ^10.1.0
  destr: ^2.0.5
  empathic: ^2.0.1
  h3: ^1.15.11
  listhen: ^1.10.1
  magic-string: ^1.1.0
  npm-run-all: ^4.1.5
  playwright: ^1.62.0
  postcss-preset-env: ^11.3.2
  react: ^19.2.8
  react-dom: ^19.2.8
  svelte: ^5.56.8
  tsx: ^4.23.1
  typescript: ~6.0.3
  vite: ^8.1.5
  vite-plugin-dts: ^5.0.3
  vite-plugin-externalize-deps: ^0.10.0
  vitest: ^4.1.10
  vue: ^3.5.40

peerDependencyRules:
  allowedVersions:
    "vite-plugin-externalize-deps>vite": "8"

minimumReleaseAgeExclude:
  - "@meeg/vite-plugin-inspect-config@0.3.0"
